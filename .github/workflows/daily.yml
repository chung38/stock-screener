name: 每日更新

# GitHub 的排程常常延遲好幾個小時、偶爾整個沒跑，所以每件事都排了備援時間；
# 已經做完的話，備援那次會在第一步就結束（約 10 秒）。時間都是台北時間：
# - 週一到週五 18:40／20:40／23:10：抓當天行情、法人等資料
# - 週一到週五 07:20／08:10：只抓國際行情與原物料（美股收盤後、台股開盤前）
# - 週六 10:30／12:30：抓集保千張大戶
on:
  schedule:
    - cron: '40 10 * * 1-5'
    - cron: '40 12 * * 1-5'
    - cron: '10 15 * * 1-5'
    - cron: '20 23 * * 0-4'
    - cron: '10 0 * * 1-5'
    - cron: '30 2 * * 6'
    - cron: '30 4 * * 6'
  workflow_dispatch:
    inputs:
      backfill:
        description: '重新補齊近 4 個月歷史資料（約 30 分鐘）'
        type: boolean
        default: false
      history:
        description: '補齊近 2 年股價，供突破策略回測（約 60–90 分鐘，只需要做一次）'
        type: boolean
        default: false
      research:
        description: '補齊 2 年月營收、毛利率、法人資料，供策略研究（約 60–80 分鐘，只需要做一次）'
        type: boolean
        default: false
      global_only:
        description: '只更新國際行情與原物料（約 1 分鐘）'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # 一律取最新的 main（排隊中的 run 才不會拿到舊資料）
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 判斷這次要做什麼
        id: need
        run: |
          MODE=daily
          case "${{ github.event.schedule }}" in
            "20 23 * * 0-4"|"10 0 * * 1-5") MODE=global ;;
            "30 2 * * 6"|"30 4 * * 6") MODE=weekly ;;
          esac
          if [ "${{ inputs.global_only }}" = "true" ]; then MODE=global; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node server/should-run.js $MODE >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.need.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: 安裝套件
        if: steps.need.outputs.run == 'true'
        run: npm ci --no-audit --no-fund

      - name: 抓資料（第一次會自動建立歷史資料）
        if: steps.need.outputs.run == 'true'
        env:
          CRON_ENABLED: '0'
          PRICE_DAYS: ${{ inputs.history && '500' || '90' }}
        run: |
          if [ "${{ steps.need.outputs.mode }}" = "global" ]; then
            node server/cli.js global
            exit 0
          fi
          if [ "${{ inputs.research }}" = "true" ]; then node server/cli.js research-data; fi
          node server/cli.js ${{ (inputs.backfill || inputs.history) && 'backfill' || 'update' }}

      - name: 把資料存回 repo
        if: always() && steps.need.outputs.run == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "資料沒有變動"
          else
            git commit -q -m "資料更新 $(TZ=Asia/Taipei date +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull -q --rebase -X theirs origin main && git push -q && break
              sleep 10
            done
          fi

      - name: 建置手機網頁
        if: steps.need.outputs.run == 'true'
        run: |
          VITE_STATIC=1 VITE_REPO=${{ github.repository }} npx vite build --base ./
          node server/cli.js export dist/data.json
          node server/cli.js backtest dist/backtest.json
          node server/cli.js research dist/research.json

      - uses: actions/configure-pages@v5
        if: steps.need.outputs.run == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.need.outputs.run == 'true'
        with:
          path: dist

      - id: deploy
        if: steps.need.outputs.run == 'true'
        uses: actions/deploy-pages@v4
