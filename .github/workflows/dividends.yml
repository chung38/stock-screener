name: 除權息資料

# 抓近 28 個月的除權息資料，給策略回測還原權息用（手動執行，約 5 分鐘）
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dividends
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 抓除權息資料
        run: node server/cli.js dividends
      - name: 存回 repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/dividends.json data/dividends-debug.json
          git commit -q -m "除權息資料 $(TZ=Asia/Taipei date +%Y-%m-%d)" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 10; done
