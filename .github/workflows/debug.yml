name: 除錯：櫃買行情端點

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debug

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 抓樣本
        run: |
          cat > dump.mjs <<'JS'
          const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130.0 Safari/537.36';
          const base = 'https://www.tpex.org.tw';
          const urls = [];
          for (const [d, roc] of [['2026/10/27', '115/10/27'], ['2025/04/15', '114/04/15']]) {
            const e = encodeURIComponent(d);
            urls.push(`${base}/www/zh-tw/afterTrading/otc?date=${e}&type=EW&response=json`);
            urls.push(`${base}/www/zh-tw/afterTrading/otc?date=${e}&type=AL&response=json`);
            urls.push(`${base}/www/zh-tw/afterTrading/dailyQ?date=${e}&type=EW&response=json`);
            urls.push(`${base}/www/zh-tw/afterTrading/dailyQ?date=${e}&response=json`);
            urls.push(`${base}/web/stock/aftertrading/daily_close_quotes/stk_quote_result.php?l=zh-tw&o=json&se=EW&d=${encodeURIComponent(roc)}`);
          }
          const out = {};
          for (const u of urls) {
            try {
              const r = await fetch(u, { headers: { 'User-Agent': UA, Accept: 'application/json' }, signal: AbortSignal.timeout(40000) });
              const t = await r.text();
              let info;
              try {
                const j = JSON.parse(t.replace(/^﻿/, ''));
                info = { keys: Object.keys(j), stat: j.stat, date: j.date,
                  tables: (j.tables ?? []).map((x) => ({ title: x.title, fields: x.fields, n: x.data?.length, first: x.data?.[0] })),
                  aa: j.aaData ? { n: j.aaData.length, first: j.aaData[0] } : undefined };
              } catch { info = { text: t.slice(0, 300) }; }
              out[u] = { status: r.status, bytes: t.length, ...info };
            } catch (e) { out[u] = { error: e.message }; }
            await new Promise((r) => setTimeout(r, 2500));
          }
          (await import('node:fs')).writeFileSync('debug-tpex-daily.json', JSON.stringify(out, null, 1));
          JS
          node dump.mjs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add debug-tpex-daily.json
          git commit -q -m "除錯樣本" && for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done || true
