name: 除錯：檢視櫃買回應格式

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 抓樣本
        run: |
          cat > dump.mjs <<'EOF'
          const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130.0 Safari/537.36';
          const urls = {
            inst_new: 'https://www.tpex.org.tw/www/zh-tw/insti/dailyTrade?type=Daily&sect=EW&date=2026%2F10%2F28&response=json',
            inst_old: 'https://www.tpex.org.tw/web/stock/3insti/daily_trade/3itrade_hedge_result.php?l=zh-tw&o=json&se=EW&t=D&d=115%2F10%2F28',
            daily_new: 'https://www.tpex.org.tw/www/zh-tw/afterTrading/dailyQ?date=2026%2F10%2F28&type=EW&response=json',
            margin_api: 'https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap17_O',
          };
          const out = {};
          function shape(j) {
            if (Array.isArray(j)) return { array: j.length, first: j[0] };
            const s = {};
            for (const [k, v] of Object.entries(j)) {
              if (Array.isArray(v)) s[k] = { len: v.length, first: v[0], second: v[1] };
              else s[k] = v;
            }
            return s;
          }
          for (const [k, u] of Object.entries(urls)) {
            try {
              const r = await fetch(u, { headers: { 'User-Agent': UA } });
              const t = await r.text();
              try { out[k] = { status: r.status, shape: shape(JSON.parse(t.replace(/^﻿/, ''))) }; }
              catch { out[k] = { status: r.status, text: t.slice(0, 1500) }; }
            } catch (e) { out[k] = { error: e.message }; }
            await new Promise((r) => setTimeout(r, 3000));
          }
          const fs = await import('node:fs');
          fs.writeFileSync('debug-tpex.json', JSON.stringify(out, null, 1).slice(0, 200000));
          EOF
          node dump.mjs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add debug-tpex.json
          git commit -q -m "除錯樣本" && git pull -q --rebase origin main && git push -q || true
